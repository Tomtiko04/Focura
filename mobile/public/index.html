<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Focura - Stay focused and organized" />
    <title>Focura</title>
    <style>
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #121212;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // This ensures the root element is properly sized
      document.addEventListener('DOMContentLoaded', () => {
        const root = document.getElementById('root');
        if (root) {
          root.style.display = 'flex';
          root.style.flex = '1';
        }
      });
    </script>
  </body>
</html>
